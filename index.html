<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>PointWeb</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#f3f4f6;
 color:#111827;
 font-family:-apple-system,BlinkMacSystemFont,
 "Segoe UI",Arial,sans-serif;
}

header{
 background:#111827;
 color:white;
 padding:16px 20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.container{
 max-width:700px;
 margin:auto;
 padding:18px;
}

.auth{
 max-width:430px;
 margin:60px auto;
}

.card{
 background:white;
 padding:20px;
 border-radius:18px;
 margin-bottom:16px;
 box-shadow:0 5px 20px rgba(0,0,0,.06);
}

input{
 width:100%;
 padding:13px;
 margin:5px 0;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:15px;
}

button{
 border:0;
 padding:11px 15px;
 border-radius:10px;
 background:#4f46e5;
 color:white;
 font-weight:700;
 cursor:pointer;
}

button:disabled{
 background:#9ca3af;
 cursor:not-allowed;
}

.logout{
 background:#ef4444;
}

.hidden{
 display:none!important;
}

.switch{
 text-align:center;
 color:#4f46e5;
 margin-top:15px;
 cursor:pointer;
}

.error{
 color:#dc2626;
 margin-top:8px;
}

.balance{
 background:linear-gradient(
  135deg,
  #4f46e5,
  #7c3aed
 );
 color:white;
 text-align:center;
}

.points{
 font-size:52px;
 font-weight:800;
 margin:8px 0;
}

.task{
 padding:15px 0;
 border-bottom:1px solid #eee;
}

.row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}

.muted{
 color:#6b7280;
 font-size:13px;
}

.green{
 color:#16a34a;
 font-weight:700;
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.stat{
 background:#f8fafc;
 padding:15px;
 border-radius:12px;
}

.stat b{
 display:block;
 font-size:25px;
 margin-top:5px;
}

.nav{
 display:flex;
 gap:8px;
 margin-bottom:15px;
}

.nav button{
 flex:1;
}

table{
 width:100%;
 border-collapse:collapse;
}

td,th{
 padding:9px;
 border-bottom:1px solid #eee;
 text-align:left;
 font-size:13px;
}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="authPage"
class="container auth">

<div id="loginBox"
class="card">

<h1>⭐ PointWeb</h1>

<p>Đăng nhập tài khoản</p>

<input
id="loginUsername"
placeholder="Tên tài khoản">

<input
id="loginPassword"
type="password"
placeholder="Mật khẩu">

<button
style="width:100%"
onclick="login()">
Đăng nhập
</button>

<div id="loginError"></div>

<div
class="switch"
onclick="showRegister()">
Chưa có tài khoản? Đăng ký
</div>

</div>


<div
id="registerBox"
class="card hidden">

<h1>⭐ PointWeb</h1>

<p>Tạo tài khoản</p>

<input
id="registerUsername"
placeholder="Tên tài khoản">

<input
id="registerPassword"
type="password"
placeholder="Mật khẩu">

<button
style="width:100%"
onclick="register()">
Đăng ký
</button>

<div id="registerError"></div>

<div
class="switch"
onclick="showLogin()">
Đã có tài khoản? Đăng nhập
</div>

</div>

</div>


<!-- ================= HEADER ================= -->

<header
id="header"
class="hidden">

<b>
⭐ PointWeb
<span id="roleText"></span>
</b>

<button
class="logout"
onclick="logout()">
Đăng xuất
</button>

</header>


<!-- ================= USER ================= -->

<main
id="userPage"
class="container hidden">

<div class="card balance">

<div>
Xin chào
<b id="userName"></b>
</div>

<div
id="userPoints"
class="points">
0
</div>

<div>⭐ Điểm</div>

</div>


<div class="card">

<h2>🎯 Nhiệm vụ</h2>

<p class="muted">
Bấm "Làm nhiệm vụ", hoàn thành link,
quay lại rồi xác nhận lần 2.
</p>

<div id="taskList"></div>

</div>


<div class="card">

<h2>📜 Lịch sử</h2>

<div id="historyList"></div>

</div>

</main>


<!-- ================= ADMIN ================= -->

<main
id="adminPage"
class="container hidden">

<div class="nav">

<button
onclick="adminTab('dashboard')">
📊 Dashboard
</button>

<button
onclick="adminTab('users')">
👥 User
</button>

<button
onclick="adminTab('tasks')">
🎯 Nhiệm vụ
</button>

</div>


<div
id="dashboardTab"
class="card">
</div>


<div
id="usersTab"
class="card hidden">

<h2>👥 Quản lý User</h2>

<div id="usersTable"></div>

</div>


<div
id="tasksTab"
class="card hidden">

<h2>🎯 Thêm nhiệm vụ</h2>

<input
id="newTaskTitle"
placeholder="Tên nhiệm vụ">

<input
id="newTaskDescription"
placeholder="Mô tả">

<input
id="newTaskReward"
type="number"
placeholder="Số điểm">

<input
id="newTaskURL"
placeholder="Link nhiệm vụ">

<button onclick="createTask()">
+ Thêm nhiệm vụ
</button>

<hr>

<h2>Danh sách</h2>

<div id="adminTasks"></div>

</div>

</main>


<script>

let token =
localStorage.getItem("pointweb_token");

let pending =
sessionStorage.getItem(
 "pointweb_pending"
);


/* ================= API ================= */

async function api(
 url,
 options={}
){

 options.headers={
  ...(options.headers||{}),
  "Content-Type":
  "application/json"
 };

 if(token){
  options.headers.Authorization =
   "Bearer "+token;
 }

 const response =
  await fetch(url,options);

 const data =
  await response.json()
  .catch(()=>({}));

 if(!response.ok){
  throw new Error(
   data.error||
   "Có lỗi xảy ra."
  );
 }

 return data;
}


/* ================= AUTH ================= */

function showRegister(){

 loginBox.classList.add(
  "hidden"
 );

 registerBox.classList.remove(
  "hidden"
 );

}

function showLogin(){

 registerBox.classList.add(
  "hidden"
 );

 loginBox.classList.remove(
  "hidden"
 );

}


async function login(){

 try{

  const data =
   await api(
    "/api/login",
    {
     method:"POST",
     body:JSON.stringify({
      username:
       loginUsername.value,
      password:
       loginPassword.value
     })
    }
   );

  token=data.token;

  localStorage.setItem(
   "pointweb_token",
   token
  );

  boot();

 }catch(error){

  loginError.className="error";
  loginError.textContent=
   error.message;

 }

}


async function register(){

 try{

  const data =
   await api(
    "/api/register",
    {
     method:"POST",
     body:JSON.stringify({
      username:
       registerUsername.value,
      password:
       registerPassword.value
     })
    }
   );

  token=data.token;

  localStorage.setItem(
   "pointweb_token",
   token
  );

  boot();

 }catch(error){

  registerError.className="error";
  registerError.textContent=
   error.message;

 }

}


function logout(){

 localStorage.removeItem(
  "pointweb_token"
 );

 sessionStorage.removeItem(
  "pointweb_pending"
 );

 location.reload();

}


/* ================= BOOT ================= */

async function boot(){

 try{

  const me =
   await api("/api/me");

  authPage.classList.add(
   "hidden"
  );

  header.classList.remove(
   "hidden"
  );

  roleText.textContent =
   me.role==="admin"
   ? " • ADMIN"
   : " • USER";


  if(me.role==="admin"){

   adminPage.classList.remove(
    "hidden"
   );

   adminTab("dashboard");

  }else{

   userPage.classList.remove(
    "hidden"
   );

   loadUser();

   if(pending){

    setTimeout(
     confirmTask,
     600
    );

   }

  }

 }catch{

  localStorage.removeItem(
   "pointweb_token"
  );

  token=null;

 }

}


/* ================= USER ================= */

async function loadUser(){

 const me =
  await api("/api/me");

 userName.textContent =
  me.username;

 userPoints.textContent =
  me.points;


 const data =
  await api("/api/tasks");


 taskList.innerHTML =
  data.tasks.map(
   task=>`

   <div class="task row">

    <div>

     <b>
      ${escapeHTML(task.title)}
     </b>

     <div class="muted">
      ${escapeHTML(task.description)}
     </div>

     <div class="green">
      +${task.reward} điểm
     </div>

    </div>

    <button
     ${task.claimed?"disabled":""}
     onclick="startTask('${task.id}')">

     ${task.claimed
      ?"Đã nhận"
      :"Làm ngay"}

    </button>

   </div>

   `
  ).join("")
  ||
  "<p>Chưa có nhiệm vụ.</p>";


 const history =
  await api("/api/history");


 historyList.innerHTML =
  history.history.length

  ?

  history.history.map(
   item=>`

   <div class="task row">

    <span>
     ${escapeHTML(item.title)}
    </span>

    <span class="green">
     +${item.reward}
    </span>

   </div>

   `
  ).join("")

  :

  "<p class='muted'>Chưa có lịch sử.</p>";

}


/* ================= TASK ================= */

async function startTask(id){

 try{

  const data =
   await api(
    "/api/tasks/"+id+"/start",
    {
     method:"POST"
    }
   );

  sessionStorage.setItem(
   "pointweb_pending",
   data.token
  );

  pending=data.token;

  /*
    Chuyển tới link nhiệm vụ
  */

  window.location.href =
   data.url;

 }catch(error){

  alert(error.message);

 }

}


/* ================= CONFIRM ================= */

async function confirmTask(){

 const taskToken =
  sessionStorage.getItem(
   "pointweb_pending"
  );

 if(!taskToken)return;


 const confirmResult =
  confirm(
   "Bạn đã hoàn thành nhiệm vụ chưa?\n\n"+
   "Bấm OK để xác nhận lần 2."
  );

 if(!confirmResult)return;


 try{

  const data =
   await api(
    "/api/tasks/confirm",
    {
     method:"POST",
     body:JSON.stringify({
      token:taskToken
     })
    }
   );

  sessionStorage.removeItem(
   "pointweb_pending"
  );

  pending=null;

  alert(
   "🎉 Đã nhận +"+
   data.reward+
   " điểm!"
  );

  loadUser();

 }catch(error){

  alert(error.message);

 }

}


/* ================= ADMIN ================= */

async function adminTab(tab){

 dashboardTab.classList.toggle(
  "hidden",
  tab!=="dashboard"
 );

 usersTab.classList.toggle(
  "hidden",
  tab!=="users"
 );

 tasksTab.classList.toggle(
  "hidden",
  tab!=="tasks"
 );


 if(tab==="dashboard")
  loadDashboard();

 if(tab==="users")
  loadUsers();

 if(tab==="tasks")
  loadAdminTasks();

}


/* ================= DASHBOARD ================= */

async function loadDashboard(){

 const data =
  await api(
   "/api/admin/stats"
  );

 dashboardTab.innerHTML=`

 <h2>📊 Dashboard</h2>

 <div class="stats">

  <div class="stat">
   User
   <b>${data.users}</b>
  </div>

  <div class="stat">
   User hoạt động
   <b>${data.activeUsers}</b>
  </div>

  <div class="stat">
   Nhiệm vụ
   <b>${data.tasks}</b>
  </div>

  <div class="stat">
   Lượt nhận
   <b>${data.claims}</b>
  </div>

  <div class="stat">
   Tổng điểm
   <b>${data.totalPoints}</b>
  </div>

 </div>

 `;

}


/* ================= USERS ================= */

async function loadUsers(){

 const data =
  await api(
   "/api/admin/users"
  );

 if(!data.users.length){

  usersTable.innerHTML=
   "<p>Chưa có User.</p>";

  return;

 }


 usersTable.innerHTML=`

 <table>

 <tr>
  <th>User</th>
  <th>Điểm</th>
  <th>Điều khiển</th>
 </tr>

 ${data.users.map(
  user=>`

  <tr>

   <td>
    <b>
     ${escapeHTML(user.username)}
    </b>
    <br>
    <small>
     ${user.active
      ?"Đang hoạt động"
      :"Đã khóa"}
    </small>
   </td>

   <td>
    ${user.points}
   </td>

   <td>

    <button
     onclick="changePoints(
      '${user.id}',1
     )">
     +1
    </button>

    <button
     onclick="changePoints(
      '${user.id}',-1
     )">
     -1
    </button>

    <button
     onclick="changeStatus(
      '${user.id}',
      ${!user.active}
     )">
     ${user.active
      ?"Khóa"
      :"Mở"}
    </button>

   </td>

  </tr>

  `
 ).join("")}

 </table>

 `;

}


async function changePoints(
 id,
 amount
){

 try{

  await api(
   "/api/admin/users/"+id+"/points",
   {
    method:"POST",
    body:JSON.stringify({
     amount
    })
   }
  );

  loadUsers();

 }catch(error){

  alert(error.message);

 }

}


async function changeStatus(
 id,
 active
){

 try{

  await api(
   "/api/admin/users/"+id+"/status",
   {
    method:"POST",
    body:JSON.stringify({
     active
    })
   }
  );

  loadUsers();

 }catch(error){

  alert(error.message);

 }

}


/* ================= ADMIN TASKS ================= */

async function createTask(){

 try{

  await api(
   "/api/admin/tasks",
   {
    method:"POST",
    body:JSON.stringify({

     title:
      newTaskTitle.value,

     description:
      newTaskDescription.value,

     reward:
      newTaskReward.value,

     url:
      newTaskURL.value

    })
   }
  );

  newTaskTitle.value="";
  newTaskDescription.value="";
  newTaskReward.value="";
  newTaskURL.value="";

  loadAdminTasks();

 }catch(error){

  alert(error.message);

 }

}


async function loadAdminTasks(){

 const data =
  await api(
   "/api/admin/tasks"
  );

 adminTasks.innerHTML =
  data.tasks.map(
   task=>`

   <div class="task">

    <div class="row">

     <b>
      ${escapeHTML(task.title)}
     </b>

     <span class="green">
      +${task.reward}
     </span>

    </div>

    <div class="muted">
     ${escapeHTML(task.url)}
    </div>

    <br>

    <button
     class="logout"
     onclick="disableTask(
      '${task.id}'
     )">

     Tắt nhiệm vụ

    </button>

   </div>

   `
  ).join("");

}


async function disableTask(id){

 if(
  !confirm(
   "Bạn có chắc muốn tắt nhiệm vụ này?"
  )
 )return;

 try{

  await api(
   "/api/admin/tasks/"+id,
   {
    method:"DELETE"
   }
  );

  loadAdminTasks();

 }catch(error){

  alert(error.message);

 }

}


/* ================= SECURITY ================= */

function escapeHTML(value){

 return String(value)
  .replace(
   /[&<>"']/g,
   character=>({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"

   }[character])
  );

}


/* ================= START ================= */

if(token){

 boot();

}

</script>

</body>
</html>
